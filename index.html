<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="tn49-gadgetz-icon-192.png">

  <title>TN49 Gadgetz Lucky Spin</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #292929 0%, #0b0b0b 42%, #000 100%);
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px 14px 35px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      object-fit: contain;
      display: block;
      margin: 5px auto 8px;
      filter: drop-shadow(0 0 15px rgba(255, 204, 0, .35));
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .5px;
      color: #ffd21c;
      text-shadow: 0 0 12px rgba(255, 210, 28, .35);
    }

    .subtitle {
      margin: 6px 0 18px;
      color: #ddd;
      font-size: 14px;
    }

    .card {
      background: linear-gradient(145deg, #171717, #090909);
      border: 1px solid rgba(255, 211, 35, .35);
      border-radius: 22px;
      padding: 18px 14px 22px;
      box-shadow:
        0 15px 45px rgba(0,0,0,.65),
        inset 0 0 25px rgba(255,200,0,.035);
    }

    input {
      width: 100%;
      height: 52px;
      margin-bottom: 12px;
      padding: 0 16px;
      border-radius: 13px;
      border: 1px solid #444;
      outline: none;
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      border-color: #ffd21c;
      box-shadow: 0 0 10px rgba(255,210,28,.2);
    }

    .wheel-area {
      position: relative;
      width: min(88vw, 390px);
      height: min(88vw, 390px);
      margin: 20px auto;
    }

    .pointer {
      position: absolute;
      z-index: 10;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 38px solid #fff;
      filter:
        drop-shadow(0 2px 3px #000)
        drop-shadow(0 0 7px #ffd21c);
    }

    #wheel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 8px solid #ffd21c;
      background: #111;
      box-shadow:
        0 0 0 4px #111,
        0 0 0 7px #ffd21c,
        0 0 35px rgba(255,210,28,.45);
      transition: transform 5s cubic-bezier(.15,.75,.12,1);
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 50%;
      left: 50%;
      top: 50%;
      transform-origin: 0% 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 4px #000;
      padding-left: 42px;
      padding-bottom: 42px;
    }

    .s1 {
      background: #f2c300;
      transform: rotate(-30deg) skewY(-30deg);
    }

    .s2 {
      background: #159447;
      transform: rotate(30deg) skewY(-30deg);
    }

    .s3 {
      background: #7c3aed;
      transform: rotate(90deg) skewY(-30deg);
    }

    .s4 {
      background: #f97316;
      transform: rotate(150deg) skewY(-30deg);
    }

    .s5 {
      background: #1479d1;
      transform: rotate(210deg) skewY(-30deg);
    }

    .s6 {
  background: #e53935;
      transform: rotate(270deg) skewY(-30deg);
    }

    .segment span {
      display: block;
      transform: skewY(30deg) rotate(30deg);
      width: 95px;
      font-size: 12px;
    }

    .center {
      position: absolute;
      z-index: 8;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #333, #050505);
      border: 5px solid #ffd21c;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd21c;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(255,210,28,.45);
    }

    .spin-btn {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #fff200, #ffb300);
      color: #090909;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255,193,7,.3);
    }

    .spin-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 18px 14px;
      border-radius: 16px;
      background: #111;
      border: 1px solid #ffd21c;
    }

    .message h2 {
      color: #ffd21c;
      margin: 0 0 8px;
    }

    .prize {
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      margin: 8px 0;
    }

    .small {
      color: #aaa;
      font-size: 12px;
      margin-top: 18px;
    }

    .install-btn {
      display: none;
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border-radius: 13px;
      border: 1px solid #ffd21c;
      background: transparent;
      color: #ffd21c;
      font-size: 15px;
      font-weight: 700;
    }

    .loader {
      display: none;
      margin: 12px auto;
      width: 28px;
      height: 28px;
      border: 3px solid #444;
      border-top-color: #ffd21c;
      border-radius: 50%;
      animation: rotate .8s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 24px;
      }

      .center {
        width: 65px;
        height: 65px;
      }

      .segment span {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="logo"
      src="tn49-gadgetz-icon-192.png"
      alt="TN49 Gadgetz">

    <h1>TN49 Gadgetz</h1>

    <div class="subtitle">
      Premium Lucky Spin 🎁
    </div>

    <div class="card">

      <input
        type="text"
        id="customerName"
        placeholder="Enter Your Name"
        autocomplete="name">

      <input
        type="tel"
        id="customerMobile"
        placeholder="Enter Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel">

      <div class="wheel-area">

        <div class="pointer"></div>

        <div id="wheel">

          <div class="segment s1">
            <span>🎧<br>Neckband</span>
          </div>

          <div class="segment s2">
            <span>🎁<br>Gift Box</span>
          </div>

          <div class="segment s3">
            <span>🛡️<br>Glass</span>
          </div>

          <div class="segment s4">
            <span>📱<br>Mobile Stand</span>
          </div>

          <div class="segment s5">
            <span>🎧<br>Earbuds</span>
          </div>

          <div class="segment s6">
  <span>😔<br>Better Luck<br>Next Time</span>
</div>

          <div class="center">
            SPIN
          </div>

        </div>
      </div>

      <button
        class="spin-btn"
        id="spinButton"
        onclick="startSpin()">
        🎡 SPIN NOW
      </button>

      <div class="loader" id="loader"></div>

      <div class="message" id="resultBox">
        <h2>🎉 Congratulations!</h2>

        <div class="prize" id="prizeText"></div>

        <div>
          Thank you for shopping with
          <strong>TN49 Gadgetz</strong> ❤️
        </div>
      </div>

      <button
        class="install-btn"
        id="installButton">
        📲 Install TN49 Gadgetz App
      </button>

      <div class="small">
        One mobile number = One spin
      </div>

    </div>

  </div>

<script>

  /*
   * Google Apps Script Web App
   * IMPORTANT:
   * Code.gs API support will be added in the next step.
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbwOzMl45mlppEjef6rLW7PsZb7JK_pGCyFFPMO-uitUDnER-zElsKphVwFfR219eCEM/exec";


  const prizes = [
    "🎧 Neckband",
    "🎁 Gift Box",
    "🛡️ Tempered Glass",
    "📱 Mobile Stand",
    "🎧 Wireless Earbuds",
    "😔 Better Luck Next Time"
  ];


  let spinning = false;
  let deferredPrompt = null;


  function startSpin() {

    if (spinning) return;

    const name =
      document.getElementById("customerName").value.trim();

    const mobile =
      document.getElementById("customerMobile").value.trim();


    if (!name) {
      alert("Please enter your name.");
      return;
    }


    if (!/^[0-9]{10}$/.test(mobile)) {
      alert("Please enter a valid 10 digit mobile number.");
      return;
    }


    spinning = true;

    const button =
      document.getElementById("spinButton");

    const loader =
      document.getElementById("loader");

    button.disabled = true;

    loader.style.display = "block";


    /*
     * Random prize
     *
     * We will connect the secure Google Sheet
     * saving system in Code.gs next.
     */
    const prizeIndex =
      Math.floor(Math.random() * prizes.length);


    const prize =
      prizes[prizeIndex];


    /*
     * Each prize occupies 60 degrees.
     */
    const segmentAngle = 60;


    /*
     * Calculate wheel rotation.
     */
    const targetAngle =
      360 * 5 +
      (360 - (prizeIndex * segmentAngle + segmentAngle / 2));


    const wheel =
      document.getElementById("wheel");


    wheel.style.transform =
      "rotate(" + targetAngle + "deg)";


    setTimeout(function() {

      document.getElementById("prizeText").textContent =
        prize;

      document.getElementById("resultBox").style.display =
        "block";

      loader.style.display =
        "none";

      /*
       * Temporary local save.
       *
       * Google Sheet API connection will replace this
       * in the next Code.gs step.
       */
      localStorage.setItem(
        "tn49_spin_" + mobile,
        JSON.stringify({
          name: name,
          mobile: mobile,
          prize: prize,
          date: new Date().toISOString()
        })
      );

      spinning = false;

    }, 5200);

  }


  /*
   * PWA Install
   */

  window.addEventListener(
    "beforeinstallprompt",
    function(event) {

      event.preventDefault();

      deferredPrompt = event;

      const installButton =
        document.getElementById("installButton");

      installButton.style.display =
        "block";

    }
  );


  document
    .getElementById("installButton")
    .addEventListener("click", async function() {

      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      await deferredPrompt.userChoice;

      deferredPrompt = null;

      this.style.display = "none";

    });


  /*
   * Service Worker
   */

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register("./sw.js")
          .then(function(registration) {

            console.log(
              "TN49 Gadgetz Service Worker registered:",
              registration.scope
            );

          })
          .catch(function(error) {

            console.error(
              "Service Worker registration failed:",
              error
            );

          });

      }
    );

  }

</script>

</body>
</html>
